version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sga_postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME:-sga_db}
      POSTGRES_USER: ${DB_USER:-sga_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sga_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sga_user} -d ${DB_NAME:-sga_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sga_web_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-sga-development-key-change-in-production-12345}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - DB_NAME=${DB_NAME:-sga_db}
      - DB_USER=${DB_USER:-sga_user}
      - DB_PASSWORD=${DB_PASSWORD:-sga_password}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
