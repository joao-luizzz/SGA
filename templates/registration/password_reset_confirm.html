{% extends "base.html" %}
{% block title %}Redefinir senha — SGA{% endblock %}
{% block content %}<div class="card mx-auto p-4" style="max-width: 32rem;">
<h1 class="h4">Redefinir senha</h1>{% if validlink %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Salvar nova senha</button></form>
{% else %}<p>Link inválido ou expirado. Solicite uma nova recuperação.</p>
<a href="{% url 'accounts:password_reset' %}">Solicitar recuperação</a>{% endif %}</div>{% endblock %}
