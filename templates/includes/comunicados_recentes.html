<div class="card mt-4 overflow-hidden">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h6 class="fw-bold mb-0 d-flex align-items-center gap-2">
      <i class="bi bi-megaphone text-primary"></i>
      <span>Comunicados recentes</span>
    </h6>
    <a href="{% url 'communications:mural' %}" class="btn btn-outline-secondary btn-sm">
      <span>Ver mural</span>
      <i class="bi bi-arrow-right"></i>
    </a>
  </div>
  {% if comunicados_recentes %}
  <div>
    {% for comunicado in comunicados_recentes %}
    <a href="{% url 'communications:detail' comunicado.pk %}" class="sga-list-row">
      <div class="min-w-0">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
          <span class="badge {% if comunicado.escopo == 'GERAL' %}badge-sga-primary{% elif comunicado.escopo == 'CURSO' %}badge-sga-danger{% elif comunicado.escopo == 'TURMA' %}badge-sga-success{% else %}badge-sga-info{% endif %}">
            {{ comunicado.get_escopo_display }}
          </span>
          <span class="fw-semibold text-dark">{{ comunicado.titulo }}</span>
        </div>
        <small class="text-muted d-inline-flex align-items-center gap-1">
          <i class="bi bi-clock"></i>
          <span>{{ comunicado.publicar_em|date:'d/m/Y H:i' }}</span>
        </small>
      </div>
      <i class="bi bi-chevron-right text-muted flex-shrink-0"></i>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="card-body">
    <p class="text-muted small mb-0">Nenhum comunicado vigente para você.</p>
  </div>
  {% endif %}
</div>
