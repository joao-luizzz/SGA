    <a class="navbar-brand d-flex align-items-center text-white text-decoration-none" href="{% url 'accounts:dashboard' %}">

      </span>
      <span>SGA</span>
      <span class="badge navbar-version-badge ms-2">v3.0</span>
    </a>

    {% if user.is_authenticated %}
    <button class="btn navbar-action-btn btn-sm d-md-none ms-auto me-2" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Abrir menu de navegação">
      <i class="bi bi-list" aria-hidden="true"></i> Menu
    </button>
    {% endif %}

      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMain">
      {% if user.is_authenticated %}
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
        <li class="nav-item">
          <a class="nav-link text-white-50 px-2 d-flex align-items-center gap-1" href="{% url 'accounts:dashboard' %}">
            <i class="bi bi-grid-fill"></i>
            <span>Dashboard</span>
          </a>
        </li>
      </ul>

        <div class="d-flex align-items-center gap-3 text-white mt-2 mt-lg-0">
          <a class="btn navbar-action-btn btn-sm" href="{% url 'notifications:central' %}">
            <i class="bi bi-bell" aria-hidden="true"></i>
