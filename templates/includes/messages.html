{% if messages %}
  <div class="messages-container mb-3">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-xs d-flex align-items-center" role="alert">
        {% if message.tags == 'error' %}
          <i class="bi bi-exclamation-triangle-fill fs-5 me-2.5"></i>
        {% elif message.tags == 'success' %}
          <i class="bi bi-check-circle-fill fs-5 me-2.5"></i>
        {% elif message.tags == 'warning' %}
          <i class="bi bi-exclamation-circle-fill fs-5 me-2.5"></i>
        {% else %}
          <i class="bi bi-info-circle-fill fs-5 me-2.5"></i>
        {% endif %}
        <div class="flex-grow-1">{{ message }}</div>
        <button type="button" class="btn-close shadow-none" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
